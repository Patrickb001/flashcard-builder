<!doctype html>
<meta charset="utf-8">
<title>idb-check</title>
<pre id="out">running…</pre>
<!--
  Exercises the IndexedDB layer in a real browser, where the races it covers
  actually happen. Node has no IndexedDB, and a single-threaded stub would never
  reproduce a lost update.

    npx vite --port 5199 --strictPort
    node tools/idb-collector.cjs result.txt
    chrome --headless=new --user-data-dir=SHORT_PATH http://localhost:5199/tools/idb-check.html

  Two things this had to work around:

   - Use a SHORT --user-data-dir. A long one trips the Windows path limit and
     IndexedDB fails with "Internal error opening backing store".
   - The page posts its result to the collector on port 5200 rather than being
     scraped: headless Chrome dumps the DOM at load, long before this finishes,
     and IndexedDB work does not advance --virtual-time-budget.

  Run against the pre-fix db.ts this reported cardCount 6/25 and 4/15, which is
  what makes it a test rather than a demonstration.
-->

<script type="module">
  const lines = [];
  const log = (s) => { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); };
  let failures = 0;
  const check = (label, ok, detail) => {
    if (!ok) failures++;
    log((ok ? '  ok   ' : '  FAIL ') + label + (detail ? '   ' + detail : ''));
  };

  const deck = (id) => ({
    id, name: id, sourceFileName: 'probe', sourceType: 'md',
    createdAt: Date.now(), cardCount: 0,
  });
  const card = (deckId, i) => ({
    id: deckId + '-c' + i, deckId, front: 'Q' + i, back: 'A' + i,
    sourceLabel: 'probe', status: 'new', createdAt: Date.now() + i,
  });

  try {
    const db = await import('/src/db/db.ts');

    // ---- 0. a v2 database upgrades to v3 with nothing lost ----
    // Runs first, before anything has opened the database through db.ts: it
    // DELETES the app's database and rebuilds it at version 2 by hand. Only run
    // this page in a throwaway browser profile (a fresh --user-data-dir).
    {
      const settle = (req) =>
        new Promise((resolve, reject) => {
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      await settle(indexedDB.deleteDatabase('flashcard-forge'));

      const id = 'probe-v2';
      const openV2 = indexedDB.open('flashcard-forge', 2);
      openV2.onupgradeneeded = () => {
        const raw = openV2.result;
        const decks = raw.createObjectStore('decks', { keyPath: 'id' });
        decks.createIndex('by-createdAt', 'createdAt');
        const cards = raw.createObjectStore('flashcards', { keyPath: 'id' });
        cards.createIndex('by-deckId', 'deckId');
        const questions = raw.createObjectStore('testQuestions', { keyPath: 'id' });
        questions.createIndex('by-deckId', 'deckId');
        questions.createIndex('by-cardId', 'cardId');

        decks.put({ ...deck(id), cardCount: 1 });
        cards.put(card(id, 0));
        questions.put({
          id: 'probe-v2-q', deckId: id, cardId: id + '-c0', stem: 'S', correctAnswer: 'R',
          distractors: ['a', 'b', 'c'], explanation: 'E', cardHash: 'h',
          createdAt: Date.now(), timesAsked: 0, lastAskedAt: null, timesCorrect: 0,
        });
      };
      (await settle(openV2)).close();

      const upgraded = await db.getDeck(id);
      const upgradedCards = await db.getCardsForDeck(id);
      const upgradedQuestions = await db.getQuestionsForDeck(id);
      const folders = await db.getAllFolders();
      check('v2 upgrade: deck kept', !!upgraded && upgraded.name === id, JSON.stringify(upgraded));
      check('v2 upgrade: deck is unfiled', !!upgraded && !('folderId' in upgraded));
      check('v2 upgrade: cards kept', upgradedCards.length === 1, upgradedCards.length + '/1');
      check('v2 upgrade: questions kept', upgradedQuestions.length === 1, upgradedQuestions.length + '/1');
      check('v2 upgrade: folders store exists and is empty', Array.isArray(folders) && folders.length === 0, JSON.stringify(folders));
      await db.deleteDeck(id);
    }

    // ---- 1. concurrent addCard must not lose an increment ----
    {
      const id = 'probe-add';
      await db.saveDeckWithCards(deck(id), []);
      const N = 25;
      await Promise.all(Array.from({ length: N }, (_, i) => db.addCard(card(id, i))));
      const after = await db.getDeck(id);
      const stored = await db.getCardsForDeck(id);
      check('25 concurrent addCard: cards stored', stored.length === N, stored.length + '/' + N);
      check('25 concurrent addCard: cardCount correct', after.cardCount === N, after.cardCount + '/' + N);
      await db.deleteDeck(id);
    }

    // ---- 2. renameDeck must not clobber a concurrent cardCount ----
    {
      const id = 'probe-rename';
      await db.saveDeckWithCards(deck(id), []);
      const N = 15;
      await Promise.all([
        ...Array.from({ length: N }, (_, i) => db.addCard(card(id, i))),
        db.renameDeck(id, 'renamed-while-adding'),
      ]);
      const after = await db.getDeck(id);
      check('rename racing 15 adds: cardCount survives', after.cardCount === N, after.cardCount + '/' + N);
      check('rename racing 15 adds: name applied', after.name === 'renamed-while-adding', after.name);
      await db.deleteDeck(id);
    }

    // ---- 3. batched writes still land ----
    {
      const id = 'probe-batch';
      const cards = Array.from({ length: 40 }, (_, i) => card(id, i));
      await db.saveDeckWithCards({ ...deck(id), cardCount: 40 }, cards);
      const stored = await db.getCardsForDeck(id);
      check('saveDeckWithCards writes all 40', stored.length === 40, stored.length + '/40');
      await db.deleteDeck(id);
      const gone = await db.getCardsForDeck(id);
      check('deleteDeck cascades', gone.length === 0, gone.length + ' left');
    }

    // ---- 4. answer counts survive a duplicate in one batch ----
    {
      const id = 'probe-q';
      await db.saveDeckWithCards(deck(id), []);
      const q = {
        id: 'probe-q1', deckId: id, cardId: id + '-c0', stem: 'S', correctAnswer: 'R',
        distractors: ['a', 'b', 'c'], explanation: 'E', cardHash: 'h',
        createdAt: Date.now(), timesAsked: 0, lastAskedAt: null, timesCorrect: 0,
      };
      await db.saveQuestions([q]);
      await db.recordQuestionsAsked([
        { questionId: 'probe-q1', correct: true },
        { questionId: 'probe-q1', correct: false },
      ]);
      const [back] = await db.getQuestionsForDeck(id);
      check('same question answered twice counts twice', back.timesAsked === 2, 'timesAsked=' + back.timesAsked);
      check('correct tally kept', back.timesCorrect === 1, 'timesCorrect=' + back.timesCorrect);
      await db.deleteDeck(id);
    }

    // ---- 5. deleteFolder unfiles its decks, and only its decks ----
    {
      const keep = await db.createFolder('probe keep');
      const drop = await db.createFolder('probe drop');
      await db.saveDeckWithCards({ ...deck('probe-in-drop'), folderId: drop.id }, []);
      await db.saveDeckWithCards({ ...deck('probe-in-keep'), folderId: keep.id }, []);

      await db.deleteFolder(drop.id);

      const folders = await db.getAllFolders();
      const inDrop = await db.getDeck('probe-in-drop');
      const inKeep = await db.getDeck('probe-in-keep');
      check('deleteFolder removes the folder', !folders.some((f) => f.id === drop.id));
      check('deleteFolder keeps the folder\'s decks', !!inDrop);
      check('deleteFolder unfiles them (key removed)', !!inDrop && !('folderId' in inDrop), JSON.stringify(inDrop));
      check('deleteFolder leaves other folders\' decks alone', !!inKeep && inKeep.folderId === keep.id, JSON.stringify(inKeep));

      await db.deleteDeck('probe-in-drop');
      await db.deleteDeck('probe-in-keep');
      await db.deleteFolder(keep.id);
    }

    // ---- 6. moveDeckToFolder must not clobber a concurrent cardCount ----
    {
      const id = 'probe-move';
      const folder = await db.createFolder('probe move target');
      await db.saveDeckWithCards(deck(id), []);
      const N = 15;
      await Promise.all([
        ...Array.from({ length: N }, (_, i) => db.addCard(card(id, i))),
        db.moveDeckToFolder(id, folder.id),
      ]);
      const moved = await db.getDeck(id);
      check('move racing 15 adds: cardCount survives', moved.cardCount === N, moved.cardCount + '/' + N);
      check('move racing 15 adds: folder applied', moved.folderId === folder.id, String(moved.folderId));

      await db.moveDeckToFolder(id, null);
      const unfiled = await db.getDeck(id);
      check('move to null unfiles (key removed)', !('folderId' in unfiled), JSON.stringify(unfiled));

      let refused = false;
      try {
        await db.moveDeckToFolder(id, 'probe-no-such-folder');
      } catch {
        refused = true;
      }
      check('move into a missing folder is refused', refused);

      await db.deleteDeck(id);
      await db.deleteFolder(folder.id);
    }

    // ---- 7. folder names are unique, ignoring case and spacing ----
    {
      const rejectsAsDuplicate = async (fn) => {
        try {
          await fn();
          return false;
        } catch (err) {
          return !!err && err.name === 'DuplicateFolderNameError';
        }
      };
      const a = await db.createFolder('Probe Names');
      const b = await db.createFolder('Probe Other');

      check('createFolder rejects a case/space variant', await rejectsAsDuplicate(() => db.createFolder('  probe   names ')));
      check('renameFolder rejects another folder\'s name', await rejectsAsDuplicate(() => db.renameFolder(b.id, 'PROBE NAMES')));

      await db.renameFolder(a.id, 'probe names');
      const recased = (await db.getAllFolders()).find((f) => f.id === a.id);
      check('renameFolder allows re-casing its own name', !!recased && recased.name === 'probe names', JSON.stringify(recased));

      let emptyRefused = false;
      try {
        await db.createFolder('   ');
      } catch {
        emptyRefused = true;
      }
      check('createFolder rejects an empty name', emptyRefused);

      await db.deleteFolder(a.id);
      await db.deleteFolder(b.id);
    }

    // ---- 8. getInfographicsForDeck deletes a row with no valid blocks array ----
    {
      const id = 'probe-infographic';
      await db.saveDeckWithCards(deck(id), []);
      await db.saveInfographic({
        id: 'probe-info-good', deckId: id, title: 'Good', detail: 'basic',
        blocks: [{ type: 'bullets', icon: 'book', heading: 'H', points: ['p'] }],
        cardIds: [], createdAt: Date.now(),
      });
      // Deliberately the pre-block shape. Nothing in this app writes this
      // anymore, but a stray row like it should be cleaned up, not shown.
      await db.saveInfographic({
        id: 'probe-info-bad', deckId: id, title: 'Bad', detail: 'basic',
        sections: [{ heading: 'H', icon: 'book', points: ['p'] }],
        cardIds: [], createdAt: Date.now(),
      });

      const list = await db.getInfographicsForDeck(id);
      const listIds = list.map((i) => i.id);
      check('only the valid row is returned', JSON.stringify(listIds) === JSON.stringify(['probe-info-good']), JSON.stringify(listIds));

      const raw = await new Promise((resolve, reject) => {
        const req = indexedDB.open('flashcard-forge');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      const rawGet = await new Promise((resolve, reject) => {
        const r = raw.transaction('infographics', 'readonly').objectStore('infographics').get('probe-info-bad');
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
      raw.close();
      check('the invalid row is actually gone from the store, not just filtered from the list', rawGet === undefined, JSON.stringify(rawGet));

      await db.deleteInfographic('probe-info-good');
      await db.deleteDeck(id);
    }

    log('');
    log(failures === 0 ? 'RESULT: ALL PASSED' : 'RESULT: ' + failures + ' FAILED');
  } catch (err) {
    log('THREW: ' + (err && err.stack ? err.stack : String(err)));
    log('RESULT: ERROR');
  }

  // Headless Chrome dumps the DOM at load, long before IndexedDB work finishes,
  // so the result is posted back rather than scraped.
  try {
    await fetch('http://localhost:5200/result', {
      method: 'POST',
      mode: 'no-cors',
      body: lines.join('\n'),
    });
  } catch {
    // Nothing to do: the collector reports a timeout of its own.
  }
</script>
