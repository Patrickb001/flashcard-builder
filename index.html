<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chalk-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcard Forge — turn documents into study decks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Stamped synchronously, before any stylesheet paints, so the page never
      // flashes the wrong theme. Mirrors src/lib/theme.ts's resolution order —
      // duplicated rather than imported, because this has to run before the
      // module graph loads.
      (function () {
        try {
          var stored = localStorage.getItem('flashcard-forge:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
